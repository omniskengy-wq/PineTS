version: 2.1

jobs:
    test:
        docker:
            - image: cimg/node:20.19
        steps:
            - checkout
            - restore_cache:
                  keys:
                      - npm-v1-{{ checksum "package-lock.json" }}
            - run:
                  name: Install dependencies
                  command: npm ci
            - save_cache:
                  key: npm-v1-{{ checksum "package-lock.json" }}
                  paths:
                      - ~/.npm
            - run:
                  name: Run tests
                  command: npm test -- --run

    build:
        docker:
            - image: cimg/node:20.19
        steps:
            - checkout
            - restore_cache:
                  keys:
                      - npm-v1-{{ checksum "package-lock.json" }}
            - run:
                  name: Install dependencies
                  command: npm ci
            - run:
                  name: Build project
                  command: npm run build:prod:all

workflows:
    certification:
        jobs:
            - test
            - build
